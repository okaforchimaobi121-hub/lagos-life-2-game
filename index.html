<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101b22">
<title>Lagos Life 2 — Grass to Grace</title>
<style>
:root{--gold:#f4c24f;--panel:rgba(10,18,24,.91);--line:rgba(255,255,255,.15);--muted:#b7c4ca}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#topbar{position:fixed;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.brand,.stat,.panel,.hint{background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 24px #0005;backdrop-filter:blur(10px)}
.brand{padding:9px 12px;border-radius:12px;font-weight:900;letter-spacing:.4px;font-size:13px}.brand small{display:block;color:var(--muted);font-weight:500;font-size:10px;letter-spacing:1.2px}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.stat{padding:8px 10px;border-radius:10px;font-size:12px;font-weight:800}.stat span{color:var(--gold)}
#actions{position:fixed;right:12px;top:78px;display:flex;flex-direction:column;gap:8px;width:128px}
button{border:1px solid #ffffff25;background:linear-gradient(180deg,#293943,#18262e);color:white;font:700 12px system-ui;border-radius:11px;padding:11px 9px;box-shadow:0 5px 14px #0004;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(1px);filter:brightness(1.2)}button.primary{background:linear-gradient(180deg,#ffd76c,#c58a20);color:#201704;border-color:#ffdf83}
#controls{position:fixed;left:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:48px 48px 48px;gap:5px}
.pad{font-size:19px;padding:0;border-radius:15px;background:#101c24c9;border:1px solid #ffffff2b;backdrop-filter:blur(8px);user-select:none}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#help{position:fixed;left:14px;top:82px;max-width:min(54vw,300px);font-size:11px;line-height:1.45;color:#e5edf0;background:#101c24b8;border:1px solid #ffffff19;padding:9px 10px;border-radius:10px;pointer-events:none}
#message{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0b141bea;border:1px solid #ffffff25;border-radius:12px;padding:10px 14px;font-size:12px;max-width:80vw;text-align:center;display:none}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#02070bcc;backdrop-filter:blur(6px)}
.panel{width:min(440px,100%);max-height:80vh;overflow:auto;border-radius:18px;padding:18px}.panel h2{font-size:20px;margin:0 0 6px}.panel p{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 14px}.items{display:grid;gap:8px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px}.item strong{font-size:13px}.item small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.item button{min-width:78px}.modalfoot{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#101b22;z-index:5;text-align:center;padding:24px}#loading strong{font-size:23px}#loading small{display:block;color:var(--muted);margin-top:8px}
@media(min-width:800px){#controls{opacity:.65}#help{max-width:260px}#actions{width:145px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading"><div><strong>🏙️ LAGOS LIFE 2</strong><small>Building your city…</small></div></div>
<div id="topbar">
  <div class="brand">LAGOS LIFE 2<small>GRASS TO GRACE · OPEN CITY</small></div>
  <div class="stats"><div class="stat">₦ <span id="cash">25,000</span></div><div class="stat">JOB <span id="job">Unemployed</span></div></div>
</div>
<div id="help">Explore the city. Walk to the market, dealership, clothing shop or property office. Tap an action to interact. Keyboard: WASD / arrows.</div>
<div id="actions">
  <button class="primary" id="interact">INTERACT</button>
  <button id="jobBtn">💼 Find work</button>
  <button id="marketBtn">🛒 Market</button>
  <button id="carsBtn">🚘 Dealership</button>
  <button id="clothesBtn">👕 Clothing</button>
  <button id="houseBtn">🏠 Properties</button>
  <button id="saveBtn">💾 Save</button>
</div>
<div id="controls">
  <button class="pad" id="up" aria-label="Move forward">▲</button>
  <button class="pad" id="left" aria-label="Move left">◀</button>
  <button class="pad" id="down" aria-label="Move backward">▼</button>
  <button class="pad" id="right" aria-label="Move right">▶</button>
</div>
<div id="message"></div>
<div id="modal"><div class="panel"><h2 id="modalTitle">City</h2><p id="modalDesc"></p><div class="items" id="items"></div><div class="modalfoot"><button id="closeModal">Close</button><button class="primary" id="modalSave">Save progress</button></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $=id=>document.getElementById(id);
const state={cash:25000,job:'Unemployed',groceries:0,ownedCars:[],clothes:'Everyday',house:'None',color:'#d6a16b',lastPay:0};
let scene,camera,renderer,clock,player,playerGroup,cityGroup,carGroup,traffic=[],keys={},touch={},yaw=0,walkTime=0,activeModal='',noticeTimer=0;
const mat=(color,roughness=.85,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const M={
 road:mat('#30383c'),line:mat('#e9d9a2'),concrete:mat('#8c918b'),grass:mat('#5d7950'),
 skin:mat('#9b603d'),shirt:mat('#286d83'),pants:mat('#273746'),shoe:mat('#171b1e'),
 glass:new THREE.MeshStandardMaterial({color:'#79a9b9',roughness:.25,metalness:.2,transparent:true,opacity:.72}),
 tire:mat('#15191b'),rubber:mat('#202326'),white:mat('#e6e1d7'),gold:mat('#cba14a',.35,.55)
};
function box(parent,x,y,z,sx,sy,sz,material,opts={}){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);m.position.set(x,y,z);m.castShadow=opts.cast!==false;m.receiveShadow=true;parent.add(m);return m}
function cylinder(parent,x,y,z,r1,r2,h,material,segments=12){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
function makeTextSprite(text,color='#fff'){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='rgba(9,17,21,.86)';ctx.fillRect(0,0,512,128);ctx.strokeStyle='#e9b844';ctx.lineWidth=5;ctx.strokeRect(3,3,506,122);ctx.font='bold 42px Arial';ctx.textAlign='center';ctx.fillStyle=color;ctx.fillText(text,256,78);const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));s.scale.set(7,1.75,1);return s}
function building(x,z,w,d,h,color,label,kind='office'){
 const g=new THREE.Group();g.position.set(x,0,z);cityGroup.add(g);
 box(g,0,h/2,0,w,h,d,mat(color),{cast:true});
 box(g,0,h+.12,0,w+.25,.25,d+.25,mat('#4a5052'));
 const floors=Math.max(2,Math.floor(h/2.5)),cols=Math.max(2,Math.floor(w/1.7));
 for(let f=0;f<floors;f++)for(let c=0;c<cols;c++){
  const wx=-w/2+.75+c*(w-1.1)/Math.max(1,cols-1),wy=1.2+f*(h-1.5)/floors;
  if(wy<h-.25)box(g,wx,wy,d/2+.015,.55,.8,.035,Math.random()>.78?mat('#c7a45e'):M.glass,{cast:false});
 }
 box(g,0,.6,d/2+.12,w*.42,1.2,.18,mat('#4b3c2b'));
 const sign=makeTextSprite(label);sign.position.set(0,h+.95,d/2+.2);g.add(sign);
 if(kind==='market'){
  for(let i=0;i<3;i++){box(g,-w*.32+i*w*.32,1.35,d/2+1,.8,.08,1.7,mat(['#d84d35','#e9c34f','#368e68'][i]));box(g,-w*.32+i*w*.32,1.9,d/2+1,.08,1.1,.08,mat('#5b4933'));}
 }
 return g;
}
function makeCar(color='#d7dce0',scale=1){
 const g=new THREE.Group();const body=mat(color,.38,.22),dark=mat('#20272b',.35,.2),lamp=mat('#fff0bb',.25,.1),red=mat('#bd2d25',.3,.1);
 box(g,0,.62,0,1.95,.55,3.8,body);
 box(g,0,1.03,-.2,1.48,.65,1.95,body);
 box(g,0,1.06,.02,1.38,.49,1.62,M.glass,{cast:false});
 box(g,0,.65,1.94,1.65,.18,.12,dark);box(g,0,.65,-1.94,1.65,.18,.12,dark);
 for(const x of [-1,1])for(const z of [-1.25,1.25]){
  const wh=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.22,16),M.tire);wh.rotation.z=Math.PI/2;wh.position.set(x,.38,z);wh.castShadow=true;g.add(wh);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.23,12),mat('#aeb5b7',.35,.6));hub.rotation.z=Math.PI/2;hub.position.set(x*1.02,.38,z);g.add(hub);
 }
 for(const x of [-.62,.62]){box(g,x,.72,1.93,.35,.18,.06,lamp);box(g,x,.72,-1.94,.3,.16,.06,red)}
 g.scale.setScalar(scale);return g;
}
function makeHumanoid(){
 const g=new THREE.Group();
 const torso=box(g,0,1.3,0,.57,.72,.31,mat(state.color));const neck=cylinder(g,0,1.75,0,.09,.09,.17,M.skin);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.22,20,16),M.skin);head.position.set(0,1.98,0);head.castShadow=true;g.add(head);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.225,16,10,0,Math.PI*2,0,Math.PI*.52),mat('#201914'));hair.position.set(0,2.06,0);g.add(hair);
 const eyes=mat('#171717');for(const x of [-.075,.075])box(g,x,2.0,.195,.035,.025,.018,eyes,{cast:false});
 const arms=[],legs=[];
 for(const s of [-1,1]){
  const arm=new THREE.Group();arm.position.set(s*.38,1.55,0);const upper=box(arm,0,-.22,0,.16,.48,.17,mat('#286d83'));const hand=new THREE.Mesh(new THREE.SphereGeometry(.085,12,10),M.skin);hand.position.y=-.5;arm.add(hand);g.add(arm);arms.push(arm);
  const leg=new THREE.Group();leg.position.set(s*.17,.92,0);box(leg,0,-.27,0,.22,.58,.24,mat('#28313c'));box(leg,0,-.57,.07,.24,.14,.38,M.shoe);g.add(leg);legs.push(leg);
 }
 g.userData={arms,legs,torso};return g;
}
function tree(x,z,scale=1){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(scale);cityGroup.add(g);cylinder(g,0,1.2,0,.16,.22,2.4,mat('#63472f'));for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.ConeGeometry(1.05-i*.15,1.8,8),mat(['#2d633d','#387546','#4c824a'][i]));c.position.set(0,2.1+i*.65,0);c.castShadow=true;g.add(c)}}
function makeCity(){
 cityGroup=new THREE.Group();scene.add(cityGroup);carGroup=new THREE.Group();scene.add(carGroup);
 // A broad avenue and two side roads with sidewalks and dashed lane markings.
 box(cityGroup,0,-.09,0,150,.18,18,M.road);box(cityGroup,0,.01,9.6,150,.22,1.2,M.concrete);box(cityGroup,0,.01,-9.6,150,.22,1.2,M.concrete);
 for(let x=-72;x<75;x+=7)box(cityGroup,x,.015,0,3.2,.025,.12,M.line,{cast:false});
 box(cityGroup,-19,-.08,0,13,.16,100,M.road);for(let z=-48;z<50;z+=7)box(cityGroup,-19,.02,z,.12,.025,3.2,M.line,{cast:false});
 // blocks and compounds
 const facades=['#c5a88a','#b5b8b1','#d6c5a8','#9bafa9','#d3b8a1','#b9a2a0','#d1c8b4','#8f9b9b'];
 for(let side of [-1,1])for(let i=0;i<8;i++){
  const x=-62+i*17,z=side*(18+Math.random()*5),w=9+Math.random()*4,d=8+Math.random()*4,h=7+Math.random()*12;
  building(x,z,w,d,h,facades[(i+(side>0?2:0))%facades.length],['RESIDENCE','SHOPPING PLAZA','PHARMACY','ELECTRONICS','SUPERMARKET','FLATS','BANK','HOTEL'][i]);
 }
 building(-8,19,12,8,5,'#bd8f65','BALOGUN MARKET','market');
 building(13,-20,10,8,6,'#d1c4aa','AUTO MART','office');
 building(32,19,11,8,5,'#b6c2c2','FASHION HUB','office');
 building(-37,-22,12,9,7,'#d7c9a8','PROPERTY OFFICE','office');
 building(48,-23,11,9,10,'#aab8b7','CITY HOSPITAL','office');
 for(let i=0;i<32;i++)tree(-67+Math.random()*134,(Math.random()<.5?-1:1)*(12+Math.random()*12),.65+Math.random()*.55);
 // streetlights
 for(let x=-65;x<70;x+=13)for(let side of [-1,1]){const g=new THREE.Group();g.position.set(x,0,side*7.3);cityGroup.add(g);cylinder(g,0,2.4,0,.06,.08,4.8,mat('#45494a'));box(g,.45,4.65,0,.95,.12,.22,mat('#41484a'));box(g,.83,4.56,0,.45,.12,.2,mat('#f5df9a'));}
 // parked cars
 const colors=['#c9d0d1','#9c2c25','#253e57','#d0b16b','#33393d','#ece6d7'];
 for(let i=0;i<12;i++){const c=makeCar(colors[i%colors.length],.82);c.position.set(-59+i*10,.03,i%2?7.3:-7.3);c.rotation.y=i%2?Math.PI:0;carGroup.add(c);}
 // moving traffic on main road
 for(let i=0;i<8;i++){const c=makeCar(colors[(i+2)%colors.length],.8);c.position.set(-70+i*19,.03,i%2?3.1:-3.1);c.rotation.y=i%2?Math.PI:0;carGroup.add(c);traffic.push({mesh:c,speed:(i%2?1:-1)*(5+Math.random()*3),z:c.position.z});}
 // smaller roadside stalls
 for(let i=0;i<5;i++){const x=-50+i*20;box(cityGroup,x,.8,12.5,3.2,1.5,1.8,mat('#b87d49'));box(cityGroup,x,1.7,12.5,3.7,.12,2.2,mat(['#c34d39','#d9ae37','#367a55'][i%3]));}
}
function setSkinAndClothes(){if(!player)return;player.userData.torso.material=mat(state.clothes==='Formal'?'#182e4a':state.clothes==='Streetwear'?'#bd4438':'#286d83');}
function setup(){
 scene=new THREE.Scene();scene.background=new THREE.Color('#9dc5d4');scene.fog=new THREE.Fog('#9dc5d4',55,150);
 camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,250);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;$('game').appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight('#d7eeff','#596047',2.1));
 const sun=new THREE.DirectionalLight('#fff1d4',3);sun.position.set(-25,45,22);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-55;sun.shadow.camera.right=55;sun.shadow.camera.top=55;sun.shadow.camera.bottom=-55;scene.add(sun);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(250,250),mat('#68835a'));ground.rotation.x=-Math.PI/2;ground.position.y=-.2;ground.receiveShadow=true;scene.add(ground);
 makeCity();playerGroup=new THREE.Group();scene.add(playerGroup);player=makeHumanoid();playerGroup.add(player);playerGroup.position.set(0,0,0);
 camera.position.set(0,7,10);clock=new THREE.Clock();
 window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
 $('loading').style.display='none';animate();
}
function animate(){
 requestAnimationFrame(animate);if(!renderer)return;const dt=Math.min(clock.getDelta(),.04);
 let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+(touch.right?1:0)-(touch.left?1:0);
 let dz=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+(touch.down?1:0)-(touch.up?1:0);
 const len=Math.hypot(dx,dz);if(len>0){dx/=len;dz/=len;playerGroup.position.x+=dx*dt*6;playerGroup.position.z+=dz*dt*6;yaw=Math.atan2(dx,dz);playerGroup.rotation.y=yaw;walkTime+=dt*10;player.userData.legs[0].rotation.x=Math.sin(walkTime)*.55;player.userData.legs[1].rotation.x=-Math.sin(walkTime)*.55;player.userData.arms[0].rotation.x=-Math.sin(walkTime)*.4;player.userData.arms[1].rotation.x=Math.sin(walkTime)*.4;}else{player.userData.legs.forEach(x=>x.rotation.x*=.7);player.userData.arms.forEach(x=>x.rotation.x*=.7)}
 playerGroup.position.x=THREE.MathUtils.clamp(playerGroup.position.x,-72,72);playerGroup.position.z=THREE.MathUtils.clamp(playerGroup.position.z,-46,46);
 traffic.forEach(t=>{t.mesh.position.x+=t.speed*dt;if(t.mesh.position.x>78)t.mesh.position.x=-78;if(t.mesh.position.x< -78)t.mesh.position.x=78;});
 const target=new THREE.Vector3(playerGroup.position.x,1.3,playerGroup.position.z);const behind=new THREE.Vector3(Math.sin(yaw)*9,5.4,Math.cos(yaw)*9);camera.position.lerp(target.clone().add(behind),1-Math.pow(.001,dt));camera.lookAt(target);
 renderer.render(scene,camera);
}
function notify(s){$('message').textContent=s;$('message').style.display='block';clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('message').style.display='none',2800)}
function updateUI(){$('cash').textContent=Math.floor(state.cash).toLocaleString('en-NG');$('job').textContent=state.job}
function save(){try{localStorage.setItem('lagosLife2Save',JSON.stringify(state));notify('Progress saved on this device.')}catch(e){notify('Could not save on this browser.')}updateUI()}
function load(){try{const s=JSON.parse(localStorage.getItem('lagosLife2Save')||'null');if(s)Object.assign(state,s)}catch(e){}updateUI()}
function openModal(title,desc,entries){activeModal=title;$('modalTitle').textContent=title;$('modalDesc').textContent=desc;$('items').innerHTML='';entries.forEach(it=>{const row=document.createElement('div');row.className='item';const info=document.createElement('div');info.innerHTML='<strong></strong><small></small>';info.children[0].textContent=it.name;info.children[1].textContent=it.desc;const b=document.createElement('button');b.textContent=it.button||('₦'+it.price.toLocaleString('en-NG'));b.className=it.primary?'primary':'';b.onclick=()=>it.action();row.append(info,b);$('items').appendChild(row)});$('modal').style.display='flex'}
function closeModal(){$('modal').style.display='none';activeModal=''}
function buy(name,price,fn){if(state.cash<price){notify('Not enough cash yet. Find work and try again.');return}state.cash-=price;fn();updateUI();save();notify(name+' purchased.')}
function market(){openModal('Balogun Market','Buy supplies for your home. Prices are game currency, not real money.',[
{name:'Groceries pack',desc:'Adds groceries to your inventory.',price:1800,action:()=>buy('Groceries pack',1800,()=>state.groceries+=1)},
{name:'Family food basket',desc:'A larger basket of market food.',price:4200,action:()=>buy('Family food basket',4200,()=>state.groceries+=3)},
{name:'Sell groceries',desc:'Sell one groceries pack for ₦1,200.',button:'Sell ₦1,200',action:()=>{if(state.groceries<1){notify('You do not have groceries to sell.');return}state.groceries--;state.cash+=1200;updateUI();save();notify('Groceries sold.')}}
])}
function jobs(){openModal('Work & Earn','Choose a job. Work rewards are in-game money only.',[
{name:'Delivery rider',desc:'Quick delivery task · earn ₦3,500',button:'Do job',action:()=>{state.job='Delivery Rider';state.cash+=3500;state.lastPay=Date.now();updateUI();save();notify('Delivery complete: +₦3,500')}},
{name:'Market assistant',desc:'Help a trader · earn ₦2,200',button:'Do job',action:()=>{state.job='Market Assistant';state.cash+=2200;state.lastPay=Date.now();updateUI();save();notify('Shift complete: +₦2,200')}},
{name:'Construction helper',desc:'Work on a building site · earn ₦5,000',button:'Do job',action:()=>{state.job='Construction Helper';state.cash+=5000;state.lastPay=Date.now();updateUI();save();notify('Work complete: +₦5,000')}}
])}
function dealership(){const cars=[['Used compact car',850000,'Reliable starter car'],['Family sedan',2400000,'Comfortable four-door sedan'],['SUV',6500000,'Higher ride and more space'],['Luxury saloon',18000000,'Premium executive car']];openModal('Auto Mart','Own a vehicle in your save. These prices are fictional in-game prices.',cars.map(([name,price,desc])=>({name,price,desc,button:state.ownedCars.includes(name)?'Owned':'Buy',action:()=>{if(state.ownedCars.includes(name)){notify('You already own this vehicle.');return}buy(name,price,()=>state.ownedCars.push(name));}})))}
function clothing(){const choices=[['Everyday',0,'Everyday blue shirt'],['Streetwear',4500,'Red streetwear outfit'],['Formal',12500,'Smart formal outfit']];openModal('Fashion Hub','Change your character outfit. New looks stay saved.',choices.map(([name,price,desc])=>({name,price,desc,button:state.clothes===name?'Wearing':price===0?'Wear':'Buy',action:()=>{if(state.clothes===name){notify('You are already wearing this.');return}if(price===0){state.clothes=name;setSkinAndClothes();save();return}buy(name,price,()=>{state.clothes=name;setSkinAndClothes()})}})))}
function properties(){const homes=[['Room in shared flat',450000,'A first place to stay'],['Self-contained apartment',3200000,'Private r
